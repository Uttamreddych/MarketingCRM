version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: flowcrm-db
    environment:
      POSTGRES_DB: flowcrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pandupandu@12
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowcrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: flowcrm-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flowcrm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Pandupandu@12
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./marketcrm
    container_name: flowcrm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
